<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Info Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-600">Student Info Management</h1>

        <!-- Form for Add/Edit -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 id="form-title" class="text-xl font-semibold mb-4">Add Student</h2>
            <form id="student-form" class="space-y-4">
                <input type="hidden" id="student-db-id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Student ID</label>
                        <input type="text" id="student_id" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Name</label>
                        <input type="text" id="name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Gender</label>
                        <select id="gender" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Major</label>
                        <input type="text" id="major" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Email</label>
                        <input type="email" id="email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Phone</label>
                        <input type="text" id="phone" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 border p-2">
                    </div>
                </div>
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="resetForm()" class="bg-gray-300 hover:bg-gray-400 text-black px-4 py-2 rounded">Cancel</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">Save</button>
                </div>
            </form>
        </div>

        <!-- Student List -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Major</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Contact</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody id="student-list" class="bg-white divide-y divide-gray-200">
                    <!-- Data will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = '/api/students/';

        async function fetchStudents() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const tbody = document.getElementById('student-list');
            tbody.innerHTML = '';

            data.forEach(student => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${student.student_id}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                        ${student.name}<br>
                        <span class="text-xs text-gray-500">${student.gender}</span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${student.major}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        ${student.email}<br>${student.phone}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick='editStudent(${JSON.stringify(student).replace(/'/g, "&#39;")})' class="text-indigo-600 hover:text-indigo-900 mr-3">Edit</button>
                        <button onclick="deleteStudent(${student.id})" class="text-red-600 hover:text-red-900">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('student-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const dbId = document.getElementById('student-db-id').value;
            const payload = {
                student_id: document.getElementById('student_id').value,
                name: document.getElementById('name').value,
                gender: document.getElementById('gender').value,
                major: document.getElementById('major').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
            };

            const method = dbId ? 'PUT' : 'POST';
            const url = dbId ? `${API_URL}${dbId}` : API_URL;

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    resetForm();
                    fetchStudents();
                } else {
                    const error = await res.json();
                    alert(error.detail || 'An error occurred');
                }
            } catch (err) {
                console.error(err);
                alert('Failed to save student');
            }
        });

        function editStudent(student) {
            document.getElementById('form-title').innerText = 'Edit Student';
            document.getElementById('student-db-id').value = student.id;
            document.getElementById('student_id').value = student.student_id;
            document.getElementById('name').value = student.name;
            document.getElementById('gender').value = student.gender;
            document.getElementById('major').value = student.major;
            document.getElementById('email').value = student.email;
            document.getElementById('phone').value = student.phone;
        }

        async function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student?')) {
                const res = await fetch(`${API_URL}${id}`, { method: 'DELETE' });
                if (res.ok) {
                    fetchStudents();
                } else {
                    alert('Failed to delete student');
                }
            }
        }

        function resetForm() {
            document.getElementById('student-form').reset();
            document.getElementById('student-db-id').value = '';
            document.getElementById('form-title').innerText = 'Add Student';
        }

        // Initial fetch
        fetchStudents();
    </script>
</body>
</html>
